# deskctl config.
#
# Profiles cycle in the order listed, wrapping at the end.
#
# Image order is xrandr's connected-output order:
#   HDMI-0 (horizontal), DP-0 (vertical), DP-2 (horizontal), DP-4 (vertical)

[displays.desk]
args = [
    "--output", "HDMI-0", "--primary", "--mode", "1920x1080", "--pos", "1094x1080",
    "--output", "DP-0", "--mode", "1920x1080", "--rotate", "left", "--pos", "3014x1080",
    "--output", "DP-2", "--mode", "1920x1080", "--pos", "1094x0",
    "--output", "DP-4", "--mode", "1920x1080", "--rotate", "right", "--pos", "0x1080",
    "--output", "DP-1", "--off",
    "--output", "DP-3", "--off",
    "--output", "DP-5", "--off",
]

[[wallpapers.4]]
name = "anime"
images = [
    "/home/malechus/.local/share/wallpapers/horizontal/024.png",
    "/home/malechus/.local/share/wallpapers/vertical/051.png",
